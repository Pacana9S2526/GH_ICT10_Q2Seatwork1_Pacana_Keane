<head>

<body>

    <div class="container-fluid mt-3">
        <div class="container p-5 mt-3 bg-light text-dark rounded">
            <h1>The Nickname Atlas of South America</h1><br>
            <p>Every nation in this region carries a name through geography, history, and myth. Click a country below to uncover the title it has been given.</p>
            <select id="country_input" class="form-select mb-3">
            <option>choose a country right neoww!!</option>
            <option value="the land of messi">Argentina Messi is the Goat</option>
            <option value="the heart of south america">Bolivia</option>
            <option value="the land of arthur lima">Brazil</option>
            <option value="the birth of pedro pascal">Chile</option>
            <option value="the gateway to south america">Colombia</option>
            <option value="the country of fourworlds">Ecuador</option>
            <option value="the land of many waters">Guyana</option>
            <option value="the heart of south america">Paraguay</option>
            <option value="the land of the incas">Peru</option>
            <option value="the greenest country on erath">Suriname</option>
            <option value="the switzerland of south america">Uruguay</option>
            <option value="the land of grace">Venezuela</option>
            </select>
            <button id="search_country" class="btn btn-primary" py-click="search_nickname">Click!!</button>
            <div id="display1" class="mt-4" style="font-size: 24px;"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
